[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "chem-rag-assistant"
version = "0.2.0"
description = "Pipeline RAG con agente LangGraph para química organometálica"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "FlagEmbedding>=1.2.0",
    "huggingface_hub>=0.23.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."