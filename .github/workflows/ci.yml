# ===========================================================================
# ci.yml — Pipeline CI/CD para Chem RAG Assistant
#
# Se ejecuta automáticamente en cada push o pull request a main.
#
# Etapas:
#   1. tests: ejecuta el suite completo de tests unitarios con pytest
#   2. docker: verifica que la imagen Docker construye correctamente
#   3. deploy: hace push a HF Spaces si tests y docker pasan (solo en main)
#
# Requisitos (configurar en GitHub → Settings → Secrets and variables):
#   - HF_TOKEN: token de HF con permisos de escritura en Spaces
# ===========================================================================

name: CI/CD — Chem RAG Assistant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Tests unitarios
  # ---------------------------------------------------------------------------
  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pytest
          # Instalar solo las dependencias necesarias para los tests
          # Se excluye docling y torch para reducir el tiempo de CI
          pip install \
            langchain \
            langchain-text-splitters \
            langchain-experimental \
            langchain-huggingface \
            langchain-community \
            sentence-transformers \
            chromadb \
            numpy \
            pyyaml \
            python-dotenv \
            FlagEmbedding \
            huggingface_hub \
            fastapi \
            uvicorn \
            pydantic \
            python-multipart

      - name: Ejecutar tests unitarios
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 2 — Build de Docker
  # Verifica que el Dockerfile construye sin errores
  # Se ejecuta solo en push a main para no consumir recursos en PRs
  # ---------------------------------------------------------------------------
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false        # Solo verificar que construye — no subir a ningún registry
          tags: chem-rag-assistant:ci
          cache-from: type=gha  # Reutilizar caché de builds anteriores
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3 — Despliegue a HF Spaces
  # Solo se ejecuta si tests y docker pasan, y solo en push a main
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy a HF Spaces
    runs-on: ubuntu-latest
    needs: [ tests, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Necesario para push con historial completo

      - name: Configurar Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Push a HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space \
            https://Jesusrodriguezf90:${HF_TOKEN}@huggingface.co/spaces/Jesusrodriguezf90/chem-rag-assistant
          git push space main --force
