name: CI/CD — Chem RAG Assistant

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    # Forzar Node.js 24 para evitar el warning de deprecación de Node.js 20
    # GitHub Actions eliminará Node.js 20 el 16 de septiembre de 2026
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install \
            langchain \
            langchain-text-splitters \
            langchain-experimental \
            langchain-huggingface \
            langchain-community \
            sentence-transformers \
            chromadb \
            numpy \
            pyyaml \
            python-dotenv \
            FlagEmbedding \
            huggingface_hub \
            fastapi \
            uvicorn \
            pydantic \
            python-multipart

      - name: Ejecutar tests unitarios
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pytest tests/ -v --tb=short

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Permisos necesarios para escribir en GHCR con GITHUB_TOKEN
    # Sin esto el token por defecto solo tiene permisos de lectura
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación en GitHub Container Registry (GHCR)
      # Permite usar GHCR como backend de caché sin límite de 10GB
      # GITHUB_TOKEN se genera automáticamente por GitHub Actions — no requiere secreto manual
      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de la imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: chem-rag-assistant:ci
          # Caché en GHCR en lugar del GHA cache (límite 10GB)
          # La imagen pesa ~9.78GB — el GHA cache se eviccionaría constantemente
          # Con GHCR solo se reconstruyen las capas que hayan cambiado
          # Primera build: ~29 min. Builds posteriores sin cambios en dependencias: ~3-5 min
          cache-from: type=registry,ref=ghcr.io/jesusrodriguezf90/chem-rag-assistant:cache
          cache-to: type=registry,ref=ghcr.io/jesusrodriguezf90/chem-rag-assistant:cache,mode=max

  deploy:
    name: Deploy a HF Spaces
    runs-on: ubuntu-latest
    needs: [ tests, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Push a HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add space \
            https://Jesusrodriguezf90:${HF_TOKEN}@huggingface.co/spaces/Jesusrodriguezf90/chem-rag-assistant
          git push space main --force